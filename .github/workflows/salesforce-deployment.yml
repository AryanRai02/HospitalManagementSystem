
name: Salesforce Deployment Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-deployment:
    name: Validate Salesforce Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main'

    environment: salesforce-validation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Verify Salesforce CLI
        run: sf --version

      - name: Authenticate Salesforce Org
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "Salesforce authentication secret is missing."
            exit 1
          fi

          AUTH_FILE=$(mktemp)
          trap 'rm -f "$AUTH_FILE"' EXIT
          chmod 600 "$AUTH_FILE"

          printf '%s' "$SFDX_AUTH_URL" > "$AUTH_FILE"

          sf org login sfdx-url \
            --sfdx-url-file "$AUTH_FILE" \
            --alias HospitalCI

      - name: Validate Apex Deployment
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/classes \
            --source-dir force-app/main/default/triggers \
            --target-org HospitalCI \
            --dry-run \
            --test-level RunLocalTests \
            --wait 30

      - name: Deployment Validation Completed
        run: |
          echo "Hospital Management System deployment validation successful."
          echo "No metadata changes were committed to the Salesforce org."
