name: Salesforce Apex Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apex-tests:
    name: Run Salesforce Apex Tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: salesforce-validation
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Verify Salesforce CLI
        run: sf --version

      - name: Authenticate Salesforce Org
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "Salesforce authentication secret is missing."
            exit 1
          fi

          AUTH_FILE=$(mktemp)
          trap 'rm -f "$AUTH_FILE"' EXIT

          printf '%s' "$SFDX_AUTH_URL" > "$AUTH_FILE"

          sf org login sfdx-url \
            --sfdx-url-file "$AUTH_FILE" \
            --alias CIHospitalOrg

      - name: Run Apex Tests
        run: |
          sf apex run test \
            --target-org CIHospitalOrg \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format human \
            --wait 30

      - name: Apex Testing Completed
        run: echo "Salesforce Apex tests completed successfully."